<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Q05 정중앙에 놓기</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif;color:#14213D;background:#fff}
body{padding:40px}
.box{width:500px;height:300px;background:#E8EEFF;border:4px dashed #5B73E8;border-radius:12px}
.label{background:#C2410C;color:#fff;padding:16px 28px;border-radius:12px;font-size:28px;font-weight:700;width:max-content}

/* ▼ 여기부터 문제의 CSS 를 작성하세요 */
.box {
  position: relative;
}

.label {
  position: absolute;
  top: 50%;				
  left: 50%;
  transform: translate(-50%, -50%);
}
</style>
</head>
<body>
<div class="box">
  <div class="label">정중앙</div>
</div>
</body>
</html>
