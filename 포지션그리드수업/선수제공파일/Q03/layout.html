<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Q03 NEW 배지 달기</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif;color:#14213D;background:#fff}
body{padding:60px}
.card{width:300px;height:200px;border:3px solid #14213D;border-radius:12px;padding:20px}
.badge{background:#C2410C;color:#fff;padding:6px 14px;border-radius:999px;font-weight:700;font-size:20px}
h3{font-size:28px}
p{font-size:22px;margin-top:8px}

/* ▼ 여기부터 문제의 CSS 를 작성하세요 */

.card {
  position: relative;
}

.badge {
  position: absolute;
  top: 10px;
  right: 10px;
}

</style>
</head>
<body>
<div class="card">
  <span class="badge">NEW</span>
  <h3>신상 후드티</h3>
  <p>39,000원</p>
</div>
</body>
</html>
